name: Build Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "main.py"
      - "nexfiscal/**"
      - "nexfiscal.spec"
      - "requirements.txt"
      - "LEIA-ME.txt"
      - ".github/workflows/build-windows.yml"
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        timeout-minutes: 10
        run: pip install -r requirements.txt pyinstaller
      - name: Instalar navegador do Playwright
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium
      - name: Executar testes
        timeout-minutes: 10
        run: python -m pytest
      - name: Gerar executavel
        timeout-minutes: 20
        run: pyinstaller --noconfirm --clean nexfiscal.spec
      - name: Copiar Chromium para a pasta portatil
        shell: pwsh
        run: |
          $package = python -c "import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / 'driver' / 'package' / '.local-browsers')"
          if (!(Test-Path $package)) { throw "Navegador Playwright nao encontrado em $package" }
          Copy-Item -Path $package -Destination "dist/NexFiscal/ms-playwright" -Recurse
      - name: Copiar LEIA-ME
        shell: pwsh
        run: Copy-Item LEIA-ME.txt dist\NexFiscal\
      - name: Compactar
        timeout-minutes: 10
        shell: pwsh
        run: Compress-Archive -Path dist\NexFiscal -DestinationPath NexFiscal-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NexFiscal-Windows
          path: NexFiscal-Windows.zip
          retention-days: 14

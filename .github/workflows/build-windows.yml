name: Build Windows
permissions:
  contents: read
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        timeout-minutes: 10
        run: python -m pip install --upgrade pip==26.2.2
      - name: Instalar ferramentas de build e validacao
        timeout-minutes: 10
        run: python -m pip install -r requirements-build.txt
      - name: Validar dependencias e testes antes do empacotamento
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependencias incompatíveis' }
          python -m pip_audit --format json --output dependency-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Auditoria de dependencias falhou' }
          python -m pytest --junitxml=test-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Testes falharam' }
      - name: Instalar navegadores do Playwright
        timeout-minutes: 15
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: playwright install chromium firefox
      - name: Validar navegadores instalados
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('Chromium:', p.chromium.executable_path); print('Firefox:', p.firefox.executable_path); assert __import__('os').path.exists(p.chromium.executable_path); assert __import__('os').path.exists(p.firefox.executable_path); p.stop()"
      - name: Gerar executavel
        timeout-minutes: 20
        run: pyinstaller --noconfirm --clean nexfiscal.spec
      - name: Copiar LEIA-ME
        shell: pwsh
        run: Copy-Item LEIA-ME.txt dist\NexFiscal\
      - name: Compactar
        timeout-minutes: 10
        shell: pwsh
        run: Compress-Archive -Path dist\NexFiscal -DestinationPath NexFiscal-Windows.zip
      - name: Validar executavel antes de entregar o zip
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\NexFiscal\NexFiscal.exe" -ArgumentList "--version" -PassThru
          if (-not $p.WaitForExit(40000)) {
            Write-Output "TRAVOU: o executavel nao terminou em 40 segundos"
            $p.Kill()
            throw 'Executavel nao terminou em 40 segundos'
          } else {
            Write-Output "Codigo de saida: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw 'Executavel retornou erro' }
          }
          $d = Join-Path $env:USERPROFILE ".nexfiscal\logs"
          foreach ($f in "crash.log", "stdio.log") {
            $path = Join-Path $d $f
            if (Test-Path $path) { Write-Output "=== $f ==="; Get-Content $path -Tail 40 }
          }
      - name: Registrar dependencias do pacote
        run: python -m pip freeze --all > resolved-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NexFiscal-Windows
          path: |
            NexFiscal-Windows.zip
            resolved-dependencies.txt
            dependency-audit.json
            test-results.xml
          retention-days: 14

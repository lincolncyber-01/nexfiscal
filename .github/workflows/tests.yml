name: Python tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip==26.2.2
      - name: Install application and validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Install native Qt libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Check undefined names and unused imports
        run: python -m ruff check nexfiscal tests --select F
      - name: Audit known dependency vulnerabilities
        run: python -m pip_audit --format json --output dependency-audit.json
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --junitxml=test-results.xml
      - name: Record resolved dependencies
        if: always()
        run: python -m pip freeze --all > resolved-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            dependency-audit.json
            test-results.xml
            resolved-dependencies.txt
